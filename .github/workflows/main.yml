name: Build Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Build Properties Fix
        run: |
          echo "" >> gradle.properties
          echo "org.gradle.jvmargs=-Djava.awt.headless=true -Xmx4096m" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "ksp.use.daemon=false" >> gradle.properties

      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease -x test -x lint --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playstore-aab-file
          path: app/build/outputs/bundle/release/*.aab
