  workflows:
  android-release:
    name: Build Android AAB
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build AAB
        script: |
          gradle bundleRelease --no-daemon
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      
